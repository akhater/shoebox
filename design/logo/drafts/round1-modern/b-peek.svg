<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Shoebox, option B: lid lifted, prints peeking out. Tile = Argentum's. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#3a3f46"/>
      <stop offset="45%" stop-color="#23262b"/>
      <stop offset="100%" stop-color="#15171a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8e979f" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#5a6169" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c9d1d9" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#b4bdc7"/>
      <stop offset="20%" stop-color="#f2f5f8"/>
      <stop offset="34%" stop-color="#ffffff"/>
      <stop offset="56%" stop-color="#a8b2bd"/>
      <stop offset="78%" stop-color="#e4e9ee"/>
      <stop offset="100%" stop-color="#9aa4af"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="kraft" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#f0b24f"/>
      <stop offset="60%" stop-color="#e29c38"/>
      <stop offset="100%" stop-color="#b8772b"/>
    </linearGradient>
    <linearGradient id="bodyShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="8%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="90%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="underR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <mask id="fadeDown"><rect x="262" y="404" width="500" height="44" fill="url(#fade)"/></mask>
    <radialGradient id="ground" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fb4dc"/>
      <stop offset="100%" stop-color="#d6e8f2"/>
    </linearGradient>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9875a"/>
      <stop offset="100%" stop-color="#f6d08a"/>
    </linearGradient>
    <!-- A print: white border, landscape inside -->
    <g id="print">
      <rect width="170" height="210" rx="6" fill="#f6f3ec"/>
      <rect x="13" y="13" width="144" height="150" fill="url(#sky)"/>
      <circle cx="52" cy="50" r="15" fill="#f3c15d"/>
      <path d="M13 163 L64 104 L94 134 L126 96 L157 136 V163 Z" fill="#2f4a5f"/>
    </g>
    <g id="print2">
      <rect width="170" height="210" rx="6" fill="#f6f3ec"/>
      <rect x="13" y="13" width="144" height="150" fill="url(#dusk)"/>
      <circle cx="110" cy="70" r="20" fill="#fff4d6"/>
      <path d="M13 163 L13 128 Q60 108 100 126 T157 120 V163 Z" fill="#7a3e2b"/>
    </g>
  </defs>

  <rect x="72" y="72" width="880" height="880" rx="150" fill="url(#tile)"/>
  <rect x="72" y="72" width="880" height="880" rx="150" fill="none" stroke="url(#edge)" stroke-width="10"/>

  <ellipse cx="512" cy="744" rx="330" ry="34" fill="url(#ground)"/>

  <!-- Inside of the back wall, seen over the front rim -->
  <rect x="268" y="386" width="488" height="24" fill="#9a5f1f"/>

  <!-- Prints -->
  <use href="#print2" transform="translate(436 318) rotate(7)"/>
  <use href="#print" transform="translate(286 300) rotate(-7)"/>

  <!-- Box -->
  <path d="M262 404 H762 V708 Q762 736 734 736 H290 Q262 736 262 708 Z" fill="url(#kraft)"/>
  <path d="M262 404 H762 V708 Q762 736 734 736 H290 Q262 736 262 708 Z" fill="url(#bodyShade)"/>
  <rect x="262" y="404" width="500" height="44" fill="url(#underR)" mask="url(#fadeDown)"/>

  <!-- Silver lid, resting on the right rim -->
  <g transform="rotate(13 772 410)">
    <rect x="226" y="300" width="572" height="116" rx="16" fill="url(#silver)"/>
    <rect x="226" y="300" width="572" height="116" rx="16" fill="url(#sheen)"/>
    <rect x="226" y="300" width="572" height="116" rx="16" fill="none" stroke="#6f7881" stroke-opacity="0.6" stroke-width="3"/>
    <rect x="246" y="306" width="532" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.85"/>
  </g>
</svg>
