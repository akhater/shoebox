[package]
name = "agdata"
description = "Tells from an Argentum sidecar (.agdata) whether a photo was edited, how, and when its edit changed."
authors = ["The Shoebox contributors"]
license = "MIT"
edition = "2024"
version = "0.1.0"
rust-version = "1.98"

[dependencies]
blake3 = "1.8.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
