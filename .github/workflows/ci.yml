name: CI

# Every pull request, and every push to main: the quick checks that decide
# whether a change can merge. main is protected and requires the `check` job;
# nothing is pushed to main directly. Full builds only happen when a release
# is published (release.yml), as in Argentum.
#
# `check` runs on Windows. `linux` and `macos` build the window and run clippy
# and the tests on those systems, as separate jobs so one failing doesn't
# hide the others: recognising a disk, reading an image and building a path
# differ on each system, and a release build is too late to find out. Only
# `check` is a required status check; the other jobs report on their own.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    # Shoebox reads disks and images through Windows APIs today (roadmap 6
    # brings macOS and Linux).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install the window's dependencies
        run: npm ci

      # tsc --noEmit, then vite build (also gives Tauri its frontend folder).
      - name: Typecheck and build the window
        run: npm run build

      # The window's tests (src/test), in jsdom against a fake backend whose
      # answers take time: a view change asks only for its photos and counts,
      # an answer for a view already left is dropped, the grid keeps the last
      # photos (not clickable, then dimmed) until the new ones arrive, face
      # finding reloads only People and the photos shown, the grid and People
      # aren't drawn again for nothing; plus search, sort, marking, the viewer,
      # People and Back.
      - name: Test the window
        run: npm test

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rustflags: ''
          cache-workspaces: src-tauri

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Includes the guards behind Shoebox's promises: no code outside paths.rs
      # and organize.rs can write a file, and nothing writes outside its own
      # folders. Tests in tests/ (they write sample photos) run too.
      # And the guards that keep the window quick: no command touching the
      # catalog or a disk runs on the main thread, the window's queries answer
      # while the catalog is being written (window_never_waits), and a small
      # view costs a fraction of the whole catalog (view_cost).
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib --test '*' --workspace

  # The same checks as `check`, on Linux. The window is WebKitGTK there, and
  # the build needs its libraries (the list release.yml installs).
  linux:
    name: linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev build-essential pkg-config file patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install the window's dependencies
        run: npm ci

      # Also gives Tauri its frontend folder, which the Rust build needs.
      - name: Typecheck and build the window
        run: npm run build

      - name: Test the window
        run: npm test

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rustflags: ''
          cache-workspaces: src-tauri

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib --test '*' --workspace

  # The same checks as `check`, on macOS (Apple silicon). The system's own web
  # view and TLS, so nothing to install.
  macos:
    name: macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install the window's dependencies
        run: npm ci

      # Also gives Tauri its frontend folder, which the Rust build needs.
      - name: Typecheck and build the window
        run: npm run build

      - name: Test the window
        run: npm test

      # The cached build holds the image's Xcode path and the automatic key
      # doesn't name the macOS version, so a new image needs a new key here.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rustflags: ''
          cache-workspaces: src-tauri
          cache-key: macos-15

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib --test '*' --workspace

  # Shoebox and Argentum read RAW files through the same rawler revision, so a
  # photo reads the same in both. This warns when the two differ; it never
  # fails, and it isn't required: a revision moves in one app a pull request
  # before the other.
  rawler-rev:
    name: rawler rev
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Compare with Argentum's rawler revision
        run: |
          # The 40-character revision on a Cargo.toml's `rawler = ...` line.
          rev_of() {
            sed -nE 's/^rawler[[:space:]]*=.*rev[[:space:]]*=[[:space:]]*"([0-9a-f]{40})".*/\1/p' | head -n 1
          }
          mine=$(rev_of < src-tauri/Cargo.toml || true)
          other=$(curl -fsSL --max-time 20 https://raw.githubusercontent.com/akhater/Argentum/main/src-tauri/Cargo.toml || true)
          theirs=$(printf '%s\n' "$other" | rev_of || true)
          if [ -z "$mine" ] || [ -z "$theirs" ]; then
            echo "::warning title=rawler rev::Could not compare rawler revisions (Shoebox: ${mine:-not found}, Argentum: ${theirs:-not found})."
          elif [ "$mine" != "$theirs" ]; then
            echo "::warning title=rawler rev::Shoebox reads RAW files with rawler ${mine:0:9} and Argentum with ${theirs:0:9}. Both apps should move to the same revision together."
          else
            echo "Shoebox and Argentum both use rawler ${mine:0:9}."
          fi
          exit 0

  # src-tauri/agdata tells whether a photo was edited the way Argentum does,
  # proven against Argentum's code as it was then. This warns when the parts of
  # Argentum that rule depends on have changed since; it never fails.
  argentum-edit-rule:
    name: Argentum edit rule
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Compare with Argentum's main branch
        run: |
          set +e
          hash=$(bash src-tauri/agdata/argentum-drift.sh)
          status=$?
          case $status in
            0) echo "Argentum's edit rule is the one agdata was checked against (${hash:0:12})." ;;
            1) echo "::warning title=Argentum edit rule::The parts of Argentum that src-tauri/agdata follows have changed (now ${hash:0:12}). Run its differential check again (src-tauri/agdata/README.md), then update PINNED in argentum-drift.sh." ;;
            *) echo "::warning title=Argentum edit rule::Could not read every part of Argentum that src-tauri/agdata follows (see the log); some were moved or renamed." ;;
          esac
          exit 0
